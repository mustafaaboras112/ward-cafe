<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة كافيه ورد</title>
  <link rel="stylesheet" href="style/simple-ui.css">
  <link rel="stylesheet" href="style/security.css">
  <script>document.documentElement.classList.add('auth-pending');</script>
  <style>
    .admin-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.7fr);gap:14px;align-items:start}.menu-tools{display:grid;grid-template-columns:1fr 190px;gap:9px;margin-bottom:12px}.product-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 150px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.product-details{display:flex;align-items:center;gap:10px}.product-image{width:52px;height:52px;border-radius:11px;object-fit:cover;background:#f5edf0}.product-copy p{margin:4px 0;color:var(--muted);font-size:12px}.product-price{font-weight:900}.product-actions{display:flex;gap:6px}.product-actions button{flex:1}.category-badge{display:inline-block;margin-top:3px;font-size:11px;color:#a5335b}.editor-panel{position:sticky;top:82px}.admin-form fieldset{border:0;margin:0;padding:0;display:grid;gap:11px}.image-preview{display:flex;align-items:center;gap:10px}.image-preview img{width:52px;height:52px;border-radius:11px;object-fit:cover}.form-actions{display:flex;gap:8px}.form-actions button{flex:1}.empty-state{padding:22px;text-align:center;color:var(--muted)}#admin-feedback{margin-bottom:12px}@media(max-width:850px){.admin-layout{grid-template-columns:1fr}.editor-panel{position:static}.menu-tools{grid-template-columns:1fr}.product-row{grid-template-columns:1fr}.product-actions{width:100%}}
  </style>
</head>
<body class="simple-page">
  <header class="simple-topbar"><div class="simple-brand">كافيه <b>ورد</b> 🌸</div><span id="system-connection" class="simple-pill">الاتصال…</span></header>
  <main class="simple-main">
    <div class="simple-title"><div><h1>الإدارة</h1><p>المنيو والموظفون فقط.</p></div><button class="simple-btn primary" id="new-item-button" type="button">+ صنف جديد</button></div>
    <p id="admin-feedback" class="simple-status" role="status" hidden></p>

    <div class="admin-layout">
      <section class="simple-card">
        <div class="simple-title"><div><h2>المنيو</h2><p id="result-count">جاري التحميل…</p></div></div>
        <div class="menu-tools"><input id="menu-search" class="simple-input" type="search" placeholder="بحث"><select id="category-filter" class="simple-input"><option value="">كل الأقسام</option><option value="hot">ساخن</option><option value="cold">بارد</option><option value="sweets">حلويات</option><option value="food">مأكولات</option></select></div>
        <div id="admin-menu-list"><p class="empty-state">جاري تحميل الأصناف…</p></div>
        <span id="total-items" hidden></span><span id="total-categories" hidden></span>
      </section>

      <section class="simple-card editor-panel" id="item-editor">
        <div class="simple-title"><div><h2 id="editor-title">إضافة صنف</h2><p id="editor-mode">صنف جديد</p></div></div>
        <form id="add-item-form" class="admin-form">
          <fieldset id="item-fields">
            <label><span class="simple-label">الاسم</span><input id="item-name" class="simple-input" required maxlength="150"></label>
            <label><span class="simple-label">القسم</span><select id="item-cat" class="simple-input" required><option value="hot">ساخن</option><option value="cold">بارد</option><option value="sweets">حلويات</option><option value="food">مأكولات</option></select></label>
            <label><span class="simple-label">السعر</span><input id="item-price" class="simple-input" type="number" min="0" step="0.01" inputmode="decimal" required></label>
            <label><span class="simple-label">وصف اختياري</span><textarea id="item-desc" class="simple-input" rows="2" maxlength="500"></textarea></label>
            <label><span class="simple-label">رابط صورة اختياري</span><input id="item-img" class="simple-input" type="url" dir="ltr"></label>
            <div class="image-preview"><img id="item-preview" src="q.png" alt="معاينة"><small id="preview-caption">صورة الصنف</small></div>
            <div class="form-actions"><button id="save-item-button" class="simple-btn primary" type="submit">حفظ</button><button id="cancel-edit-button" class="simple-btn secondary" type="button" hidden>إلغاء</button></div>
          </fieldset>
        </form>
      </section>
    </div>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
