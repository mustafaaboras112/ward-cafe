<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم كافيه ورد</title>
    <link rel="stylesheet" href="style/common.css">
    <link rel="stylesheet" href="style/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
    <div class="logo" aria-label="شعار كافيه ورد"><img src="q.png" alt="كافيه ورد"></div>
    <div class="top-buttons-container">
        <a href="waiter.html">شاشة الكارسون</a>
        <a href="kitchen.html">شاشة المطبخ</a>
        <a href="index.html">عرض المنيو</a>
        <a href="accounting.html">شاشة المحاسبة</a>
        <a href="pos.html">الكاشير POS</a>
    </div>
    </header>

    <main>
        <div class="admin-box">
            <h2>إضافة صنف جديد للمنيو</h2>
            <form id="add-item-form" onsubmit="addNewItem(event)" class="admin-form">
                <input type="text" id="item-name" placeholder="اسم الصنف (مثال: قهوة لاتيه)" required>
                <select id="item-cat" required>
                    <option value="hot">مشروبات ساخنة</option>
                    <option value="cold">مشروبات باردة</option>
                    <option value="sweets">حلويات</option>
                    <option value="food">مأكولات</option>
                </select>
                <input type="number" id="item-price" placeholder="السعر (بالليرة)" required>
                <input type="text" id="item-desc" placeholder="وصف قصير للصنف" required>
                <input type="url" id="item-img" placeholder="رابط صورة الصنف (URL)" required>
                <button type="submit">إضافة الصنف</button>
            </form>
        </div>

        <div class="products-list-container">
            <h2>الأصناف الحالية في المنيو</h2>
            <div id="admin-menu-list"></div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
