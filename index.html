<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كافيه ورد - القائمة الرئيسية</title>
    <link rel="stylesheet" href="style/common.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="menu-page">
    <div id="splash-screen" aria-label="شاشة التحميل"><img src="q.png" alt="كافيه ورد"></div>

    <section class="hero-no-header">
        <div class="hero-petals" id="hero-petals"></div>

        <div class="centered-logo">
            <img src="q.png" alt="شعار كافيه ورد">
        </div>

        <div class="table-selector-container">
            <div class="table-select-box">
                <label for="table-selector"><i class="fa-solid fa-chair"></i> اختر طاولتك</label>
                <select id="table-selector">
                    <option value="1" selected>رقم 1</option>
                    <option value="2">رقم 2</option>
                    <option value="3">رقم 3</option>
                    <option value="4">رقم 4</option>
                    <option value="5">رقم 5</option>
                    <option value="6">رقم 6</option>
                    <option value="7">رقم 7</option>
                    <option value="8">رقم 8</option>
                    <option value="9">رقم 9</option>
                    <option value="10">رقم 10</option>
                    <option value="11">رقم 11</option>
                    <option value="12">رقم 12</option>
                    <option value="13">رقم 13</option>
                    <option value="14">رقم 14</option>
                    <option value="15">رقم 15</option>
                    <option value="16">رقم 16</option>
                    <option value="17">رقم 17</option>
                    <option value="18">رقم 18</option>
                    <option value="19">رقم 19</option>
                    <option value="20">رقم 20</option>
                </select>
                <strong id="selected-table-label">رقم الطاولة: 1</strong>
            </div>
            <p id="table-badge" class="table-badge">رقم الطاولة: 1</p>
        </div>
    </section>

    <div class="cart-fab" onclick="toggleCart()" aria-label="سلة المشتريات">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
    </div>

    <main>
        <div class="category-boxes" id="category-boxes">
            <div class="category-box hot-box" onclick="openCategory('hot')">
                <div class="category-icon">☕</div>
                <h3>مشروبات ساخنة</h3>
                <p>قهوة، لاتيه، شاي...</p>
            </div>
            <div class="category-box cold-box" onclick="openCategory('cold')">
                <div class="category-icon">🧊</div>
                <h3>مشروبات باردة</h3>
                <p>موهيتو، عصير، صودا...</p>
            </div>
            <div class="category-box sweets-box" onclick="openCategory('sweets')">
                <div class="category-icon">🍰</div>
                <h3>حلويات</h3>
                <p>تشيز كيك، كيك، معمول...</p>
            </div>
            <div class="category-box food-box" onclick="openCategory('food')">
                <div class="category-icon">🍔</div>
                <h3>مأكولات</h3>
                <p>ساندويش، برغر، فطور...</p>
            </div>
        </div>

        <div id="category-products" class="category-products" style="display:none;">
            <button class="back-btn" onclick="backToCategories()">➜ الرجوع للتصنيفات</button>
            <h2 id="category-title" class="category-title"></h2>
            <div id="category-items-grid" class="category-items-grid"></div>
        </div>
    </main>

    <div id="cart-modal" class="cart-modal" style="display:none;">
        <div class="cart-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2>سلة طلبات الطاولة</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                <h3>الإجمالي: <span id="total-price">0</span> ليرة</h3>
            </div>
            <button class="checkout-btn" onclick="checkout()">تأكيد وإرسال الطلب</button>
        </div>
    </div>

    <section id="customer-orders" aria-label="متابعة طلباتك" aria-live="polite"></section>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/menu.js"></script>

</body>
</html>
