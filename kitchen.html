<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة المطبخ - كافيه ورد</title>
  <link rel="stylesheet" href="style/common.css">
  <link rel="stylesheet" href="style/kitchen.css">
<link rel="stylesheet" href="style/security.css">
<script>document.documentElement.classList.add("auth-pending");</script>
</head>
<body>
  <header class="kitchen-header">
    <div class="logo"><img src="q.png" alt="كافيه ورد"></div>
  </header>

  <main class="kitchen-main">
    <div class="kitchen-topbar">
      <div>
        <h1>طلبات المطبخ</h1>
        <p>الأقدم يظهر أولاً — اضغط «تم تجهيز الطلب» عند الانتهاء.</p>
      </div>
      <div id="kitchen-summary" class="kitchen-summary" aria-live="polite"></div>
    </div>

    <section id="kitchen-orders-container" class="kitchen-grid" aria-live="polite"></section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/kitchen.js"></script>

</html>
