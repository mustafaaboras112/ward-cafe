<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>دخول الموظفين | كافيه ورد</title>
  <link rel="stylesheet" href="style/simple-ui.css">
</head>
<body>
  <main class="simple-login">
    <section class="simple-login-card">
      <div class="simple-login-logo">كافيه <b>ورد</b> 🌸</div>
      <p class="simple-login-sub">أدخل رمزك للدخول</p>

      <form id="login-form" class="simple-form" autocomplete="off">
        <label class="simple-label" for="pin">رمز الموظف</label>
        <input id="pin" class="simple-input pin-box" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="off" placeholder="••••" required autofocus>
        <div class="numeric-pad" aria-label="لوحة أرقام">
          <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
          <button type="button" id="pin-clear">مسح</button><button type="button" data-digit="0">0</button><button type="button" id="pin-back">⌫</button>
        </div>
        <button type="submit" id="login-submit" class="simple-btn primary">دخول</button>
      </form>

      <div id="session-panel" hidden class="simple-form">
        <div class="simple-status ok" id="session-name"></div>
        <button id="continue-button" type="button" class="simple-btn primary">العودة إلى العمل</button>
        <button id="logout-button" type="button" class="simple-btn secondary">تسجيل الخروج</button>
      </div>

      <p id="auth-status" class="simple-status" role="status" aria-live="polite" hidden></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
