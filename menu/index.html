<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كافيه ورد - القائمة الرئيسية</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="menu-page">
    <div id="splash-screen" aria-label="شاشة التحميل"><img src="../q.png" alt="كافيه ورد"></div>

    <section class="hero-no-header">
        <div class="hero-petals" id="hero-petals"></div>

        <div class="centered-logo">
            <img src="../q.png" alt="شعار كافيه ورد">
        </div>

        <div class="table-selector-container">
            <div class="table-select-box">
                <label for="table-selector"><i class="fa-solid fa-chair"></i> اختر طاولتك</label>
                <select id="table-selector" onchange="changeTable(this.value)">
                    <option value="1" selected>رقم 1</option>
                    <option value="2">رقم 2</option>
                    <option value="3">رقم 3</option>
                    <option value="4">رقم 4</option>
                    <option value="5">رقم 5</option>
                    <option value="6">رقم 6</option>
                    <option value="7">رقم 7</option>
                    <option value="8">رقم 8</option>
                    <option value="9">رقم 9</option>
                    <option value="10">رقم 10</option>
                    <option value="11">رقم 11</option>
                    <option value="12">رقم 12</option>
                    <option value="13">رقم 13</option>
                    <option value="14">رقم 14</option>
                    <option value="15">رقم 15</option>
                    <option value="16">رقم 16</option>
                    <option value="17">رقم 17</option>
                    <option value="18">رقم 18</option>
                    <option value="19">رقم 19</option>
                    <option value="20">رقم 20</option>
                </select>
                <strong id="selected-table-label">رقم الطاولة: 1</strong>
            </div>
            <p id="table-badge" class="table-badge">رقم الطاولة: 1</p>
        </div>
    </section>

    <div class="cart-fab" onclick="toggleCart()" aria-label="سلة المشتريات">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
    </div>

    <main>
        <div class="categories">
            <button class="cat-btn active" onclick="filterMenu('all')">الكل</button>
            <button class="cat-btn" onclick="filterMenu('hot')">مشروبات ساخنة</button>
            <button class="cat-btn" onclick="filterMenu('cold')">مشروبات باردة</button>
            <button class="cat-btn" onclick="filterMenu('sweets')">حلويات</button>
            <button class="cat-btn" onclick="filterMenu('food')">مأكولات</button>
        </div>

        <div class="menu-grid" id="menu-grid"></div>
    </main>

    <div id="cart-modal" class="cart-modal" style="display:none;">
        <div class="cart-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2>سلة طلبات الطاولة</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                <h3>الإجمالي: <span id="total-price">0</span> ليرة</h3>
            </div>
            <button class="checkout-btn" onclick="checkout()">تأكيد وإرسال الطلب</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../script.js"></script>
    <script>
        function confirmTable() {
            const select = document.getElementById('table-selector');
            const badge = document.getElementById('table-badge');
            if (select && badge) {
                badge.textContent = 'رقم الطاولة: ' + select.value;
            }
            if (typeof changeTable === 'function') {
                changeTable(select.value);
            }
        }

        function createHeroPetals() {
            const container = document.getElementById('hero-petals');
            if (!container) return;
            for (let i = 0; i < 12; i++) {
                const petal = document.createElement('div');
                petal.className = 'hero-petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (4 + Math.random() * 2.5) + 's';
                petal.style.animationDelay = (Math.random() * 4) + 's';
                container.appendChild(petal);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            createHeroPetals();
        });
    </script>
</body>
</html>
