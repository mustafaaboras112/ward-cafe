<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كافيه ورد — الكاشير</title>
    <link rel="stylesheet" href="style/common.css">
    <link rel="stylesheet" href="style/pos.css">
</head>
<body class="pos-page">
    <header><div class="logo"><img src="q.png" alt="كافيه ورد"></div><h1>الكاشير</h1><nav><a href="waiter.html">الكارسون</a> <a href="accounting.html">المحاسبة</a> <a href="admin.html">الإدارة</a></nav></header>
    <main class="pos-layout">
        <section class="pos-panel"><h2>حسابات الطاولات</h2><p>تظهر جميع الحسابات المفتوحة، ويتاح الدفع بعد تأكيد التوصيل.</p><div id="pos-tables"></div></section>
        <section class="pos-panel pos-invoice"><h2 id="pos-title">اختر طاولة لعرض الفاتورة</h2><div id="pos-items"></div>
            <div class="pos-line pos-total"><span>الإجمالي</span><strong id="pos-total">0.00 ليرة</strong></div>
            <form id="pos-payment">
                <label for="pos-method">طريقة الدفع</label><select id="pos-method"><option value="cash">نقداً</option><option value="card">بطاقة — تم التحصيل على الجهاز</option></select>
                <label for="pos-received">المبلغ المستلم نقداً</label><input id="pos-received" type="number" min="0" step="0.01" inputmode="decimal">
                <div class="pos-line"><span>الباقي</span><strong id="pos-change">0.00 ليرة</strong></div>
                <button id="pos-pay" class="btn-action" type="submit" disabled>تأكيد استلام الدفع (F12)</button>
            </form>
            <p id="pos-feedback" role="status" aria-live="polite"></p><button id="pos-print" type="button">طباعة</button>
        </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script><script src="js/common.js"></script><script src="js/pos.js"></script>
</body>
</html>
